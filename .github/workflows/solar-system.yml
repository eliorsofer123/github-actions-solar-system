name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: 'superuser'
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        container:
          image: node:20 

        steps:
        - name: Checkout Repository
          uses: actions/checkout@v7.0.1

        # - name: Setup NodeJS Version
        #   uses: actions/setup-node@v7.0.0
        #   with:
        #     node-version: 20

        - name: Cache NPM dependencies
          uses: actions/cache@v6.1.0
          with: 
            path: ~/.npm
            key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
            
            
        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          if: always()
          uses: actions/upload-artifact@v7.0.1
          with:
            name: Mocha-Test-Result
            path: test-results.xml

    code-coverage:
        name: Code coverage
        runs-on: ubuntu-latest

        steps:
        - name: Checkout Repository
          uses: actions/checkout@v7.0.1

        - name: Setup NodeJS Version
          uses: actions/setup-node@v7.0.0
          with:
            node-version: 18

        - name: Install Dependencies
          run: npm install

        - name: Code Coverage
          continue-on-error: true
          run: npm run coverage 

        - name: Archive Code Coverage Result
          uses: actions/upload-artifact@v7.0.1
          with:
            name: Code-Coverage-Result
            path: coverage
            retention-days: 5

    docker:
      permissions:
        packages: write
      needs: [unit-testing, code-coverage]
      runs-on: ubuntu-latest
      steps: 
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: docker login
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/solar-system:latest

    dev-deploy:
      needs: docker
      runs-on: ubuntu-latest
      environment:
        name: development
      steps:
        - name: Installing Kunernetes Cluster
          uses: helm/kind-action@v1.15.0

        - name:  Test Pod Deployment
          run: |
            sleep 60
            kubectl -n kube-system get pod
            set +e
            REPO_OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
            kubectl run solar --image ghcr.io/${REPO_OWNER_LC}/solar-system:${{ github.sha }} \
              --env MONGO_URI=${{ env.MONGO_URI}} \
              --env MONGO_USERNAME=${{ env.MONGO_USERNAME}} \
              --env MONGO_PASSWORD=${{ env.MONGO_PASSWORD}}
            set -e
            echo "kubectl returned $?"
            kubectl -n default get pod
            sleep 10

